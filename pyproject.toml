[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-image-super-resolution"
version = "0.4.0"
description = "Interactive local Real-ESRGAN image upscaler and wallpaper workspace"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0"
]

[project.scripts]
upscaler = "upscaler.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
